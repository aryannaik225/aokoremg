services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      DECISION_CUTOFF_TIME: "11:00"
      DELIVERY_WINDOW_START: "2026-01-02"
      DELIVERY_WINDOW_END: "2026-02-01"
      DB_PATH: /app/data/gridbricks.db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:4173"
    environment:
      # Passed through from the host shell when set (e.g. GitHub Codespaces
      # exports these automatically); the frontend entrypoint uses them to
      # build the backend's forwarded-port URL at container start.
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
